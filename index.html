<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a120b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lignée Targaryen</title>
<style>
:root{
  --pap:#f0e6d2; --pap2:#e6d9be; --card:#f7efdf; --enc:#2b2117; --enc2:#6d5c46;
  --or:#9a6b1f; --rouge:#8c1c13; --ligne:#a8967a; --ombre:rgba(60,42,20,.18);
  --fs:1;
}
[data-theme=nuit]{
  --pap:#12100e; --pap2:#1a1613; --card:#1f1a15; --enc:#ece2d0; --enc2:#a2907a;
  --or:#c9a227; --rouge:#c1352a; --ligne:#5a4c3b; --ombre:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--pap); color:var(--enc);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:calc(16px * var(--fs)); line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

/* ---------- structure ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;
  padding-top:calc(.55rem + env(safe-area-inset-top));
  background:var(--pap2);border-bottom:1px solid var(--ligne);z-index:5;
}
header h1{font-size:1.05rem;margin:0;flex:1;font-weight:600;letter-spacing:.02em}
header h1 small{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--enc2);font-weight:400}
.iconbtn{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;border:1px solid transparent}
.iconbtn:active{background:var(--ombre)}
main{flex:1;position:relative;overflow:hidden}
.vue{position:absolute;inset:0;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.vue.on{display:block}
nav{
  display:flex;background:var(--pap2);border-top:1px solid var(--ligne);
  padding-bottom:env(safe-area-inset-bottom);z-index:5;
}
nav button{flex:1;padding:.45rem 0 .5rem;display:flex;flex-direction:column;align-items:center;gap:.12rem;color:var(--enc2);font-size:.66rem;letter-spacing:.06em}
nav button i{font-style:normal;font-size:1.15rem;line-height:1}
nav button.on{color:var(--rouge)}

/* ---------- arbre ---------- */
#zone{position:absolute;inset:0;overflow:hidden;touch-action:none;background:
  radial-gradient(120% 90% at 50% 0%, var(--pap) 40%, var(--pap2) 100%)}
#pan{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#svg{display:block}
.lien{fill:none;stroke:var(--ligne);stroke-width:1.6}
.lien.mar{stroke:var(--enc2);stroke-width:1.8}
.lien.hi{stroke:var(--rouge);stroke-width:2.6}
.nd rect{fill:var(--card);stroke:var(--ligne);stroke-width:1.4;rx:5}
.nd .nm{font-size:13px;font-weight:600;fill:var(--enc)}
.nd .an{font-size:9.5px;fill:var(--enc2);letter-spacing:.03em}
.nd .hs{font-size:8.5px;fill:var(--enc2);letter-spacing:.08em;text-transform:uppercase}
.nd.roi rect{stroke:var(--or);stroke-width:2.2;fill:var(--card)}
.nd.sel rect{stroke:var(--rouge);stroke-width:2.8}
.nd.dim{opacity:.28}
.nd.match rect{fill:#f6e2a8}
[data-theme=nuit] .nd.match rect{fill:#3a2f16}
.nd .cr{font-size:11px}
.nd .dg{font-size:8.5px;fill:var(--rouge)}
body.faction .nd.fn rect{stroke:#1c1c1c;fill:#d9cdb4}
body.faction .nd.fv rect{stroke:#1f5c33;fill:#dfe8d4}
[data-theme=nuit] body.faction .nd.fn rect{fill:#26221c;stroke:#8d8d8d}
[data-theme=nuit] body.faction .nd.fv rect{fill:#1b2a1e;stroke:#4e9a68}
.ctrl{position:absolute;right:.6rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:3}
.ctrl button{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--card);border:1px solid var(--ligne);
  box-shadow:0 2px 6px var(--ombre);display:grid;place-items:center;font-size:1.05rem}
#aide{position:absolute;left:50%;top:3.2rem;transform:translateX(-50%);z-index:6;max-width:82vw;
  background:var(--enc);color:var(--pap);border-radius:10px;padding:.6rem .85rem;font-size:.82rem;
  box-shadow:0 4px 14px var(--ombre);text-align:center;line-height:1.4;transition:opacity .4s}
#aide.parti{opacity:0;pointer-events:none}
.legende{position:absolute;left:.6rem;bottom:.7rem;z-index:3;background:var(--card);border:1px solid var(--ligne);
  border-radius:6px;padding:.4rem .55rem;font-size:.68rem;color:var(--enc2);box-shadow:0 2px 6px var(--ombre);max-width:52vw}
.legende b{color:var(--enc);font-weight:600}
.barre{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;gap:.35rem;padding:.4rem .5rem;
  background:linear-gradient(var(--pap2),transparent);overflow-x:auto;scrollbar-width:none}
.barre::-webkit-scrollbar{display:none}
.puce{white-space:nowrap;border:1px solid var(--ligne);background:var(--card);border-radius:999px;
  padding:.22rem .6rem;font-size:.72rem;color:var(--enc2)}
.puce.on{background:var(--enc);color:var(--pap);border-color:var(--enc)}

/* ---------- listes ---------- */
.wrap{padding:.6rem .8rem 4rem}
.chercher{position:sticky;top:0;background:var(--pap);padding:.5rem 0 .55rem;z-index:2}
.chercher input{width:100%;padding:.55rem .75rem;border:1px solid var(--ligne);border-radius:8px;
  background:var(--card);color:var(--enc);font:inherit;font-size:.95rem}
.sect{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--enc2);
  margin:1.1rem 0 .4rem;border-bottom:1px solid var(--ligne);padding-bottom:.2rem}
.ligne{display:flex;align-items:center;gap:.6rem;padding:.5rem .2rem;border-bottom:1px solid var(--ombre);width:100%;text-align:left}
.ligne .av{width:2rem;height:2rem;flex:none;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--ligne);background:var(--pap2);font-size:.8rem}
.ligne .av.roi{border-color:var(--or);color:var(--or)}
.ligne .t{flex:1;min-width:0}
.ligne .t b{font-weight:600;display:block}
.ligne .t span{font-size:.75rem;color:var(--enc2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .an{font-size:.72rem;color:var(--enc2);flex:none;font-variant-numeric:tabular-nums}

/* ---------- chronologie ---------- */
.chrono{position:relative;padding-left:1.5rem;margin-top:.6rem}
.chrono:before{content:"";position:absolute;left:.42rem;top:.3rem;bottom:.3rem;width:2px;background:var(--ligne)}
.ev{position:relative;padding:.45rem 0 .55rem}
.ev:before{content:"";position:absolute;left:-1.35rem;top:.8rem;width:.6rem;height:.6rem;border-radius:50%;
  background:var(--pap);border:2px solid var(--ligne)}
.ev.roi:before{border-color:var(--or);background:var(--or)}
.ev .y{font-size:.72rem;letter-spacing:.1em;color:var(--rouge);font-variant-numeric:tabular-nums}
.ev .d{font-size:.9rem}
.ev b{font-weight:600}

/* ---------- fiche ---------- */
#fiche{position:fixed;inset:0;z-index:20;display:none}
#fiche.on{display:block}
.voile{position:absolute;inset:0;background:rgba(20,14,6,.45)}
.feuille{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);
  border-top-left-radius:14px;border-top-right-radius:14px;box-shadow:0 -6px 24px var(--ombre);
  padding:.2rem 1rem calc(1.4rem + env(safe-area-inset-bottom));animation:mont .22s ease-out}
@keyframes mont{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.poignee{width:2.4rem;height:.25rem;border-radius:99px;background:var(--ligne);margin:.5rem auto .7rem}
.fh{display:flex;align-items:flex-start;gap:.6rem}
.fh h2{margin:0;font-size:1.35rem;font-weight:600;line-height:1.2;flex:1}
.fh .x{font-size:1.3rem;color:var(--enc2)}
.epi{color:var(--rouge);font-style:italic;font-size:.95rem;margin:.1rem 0 .5rem}
.meta{display:flex;flex-wrap:wrap;gap:.3rem;margin:.5rem 0 .7rem}
.tag{font-size:.72rem;border:1px solid var(--ligne);border-radius:999px;padding:.15rem .55rem;color:var(--enc2)}
.tag.or{border-color:var(--or);color:var(--or)}
.tag.dg{border-color:var(--rouge);color:var(--rouge)}
.bio{font-size:.95rem;margin:.2rem 0 .9rem}
.masque{background:var(--pap2);border:1px dashed var(--ligne);border-radius:8px;padding:.6rem;text-align:center;color:var(--enc2);font-size:.85rem}
.masque button{color:var(--rouge);text-decoration:underline;margin-top:.3rem}
.rel h4{margin:.9rem 0 .35rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--enc2);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--ligne);background:var(--pap2);border-radius:999px;padding:.25rem .6rem;font-size:.82rem;text-align:left}
.chip small{color:var(--enc2);font-size:.72rem}
.chip.roi{border-color:var(--or)}
.act{display:flex;gap:.5rem;margin-top:1rem}
.act button{flex:1;padding:.6rem;border:1px solid var(--enc);border-radius:8px;font-size:.85rem;background:var(--enc);color:var(--pap)}
.act button.sec{background:none;color:var(--enc)}

/* ---------- réglages ---------- */
.opt{display:flex;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--ombre)}
.opt .t{flex:1}
.opt .t b{display:block;font-weight:600}
.opt .t span{font-size:.78rem;color:var(--enc2)}
.seg{display:flex;border:1px solid var(--ligne);border-radius:8px;overflow:hidden}
.seg button{padding:.35rem .7rem;font-size:.8rem;color:var(--enc2)}
.seg button.on{background:var(--enc);color:var(--pap)}
select{font:inherit;font-size:.85rem;padding:.4rem;border:1px solid var(--ligne);border-radius:8px;background:var(--card);color:var(--enc)}
.note{font-size:.8rem;color:var(--enc2);margin-top:1rem;line-height:1.5}
</style>

<div id="app">
  <header>
    <h1>Lignée Targaryen<small>Feu &amp; Sang · 1 – 136 ap. C.</small></h1>
    <button class="iconbtn" id="btn-cherche" aria-label="Rechercher">⌕</button>
  </header>

  <main>
    <section class="vue on" id="v-arbre">
      <div id="zone"><div id="pan"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
      <div class="barre" id="barre"></div>
      <div class="legende" id="legende"></div>
      <div class="ctrl">
        <button id="z-plus">+</button>
        <button id="z-moins">−</button>
        <button id="z-fit" aria-label="Tout voir">⤢</button>
      </div>
    </section>

    <section class="vue" id="v-liste"><div class="wrap">
      <div class="chercher"><input id="q" type="search" placeholder="Chercher un nom…" autocomplete="off"></div>
      <div id="liste"></div>
    </div></section>

    <section class="vue" id="v-rois"><div class="wrap" id="rois"></div></section>

    <section class="vue" id="v-reglages"><div class="wrap" id="reglages"></div></section>
  </main>

  <nav>
    <button class="on" data-v="arbre"><i>⛬</i>Arbre</button>
    <button data-v="liste"><i>☰</i>Personnes</button>
    <button data-v="rois"><i>♛</i>Chronologie</button>
    <button data-v="reglages"><i>⚙</i>Réglages</button>
  </nav>
</div>

<div id="fiche"><div class="voile"></div><div class="feuille" id="feuille"></div></div>

<script>
/* ======================================================================
   DONNÉES — Feu & Sang, de la Conquête d'Aegon à l'avènement d'Aegon III
   n:nom  e:épithète  s:sexe  b:naissance  d:mort  r:rangée dans l'arbre
   h:maison  k:[n° de roi, règne]  dr:dragon  f:camp pendant la Danse
   ====================================================================== */
const VERSION_APP = "2026.08.17-3";
const GENS = [
["aerion",{n:"Aerion Targaryen",t:"Seigneur de Peyredragon",s:"m",b:null,d:null,r:0,h:"Targaryen",
  bio:"Seigneur de Peyredragon avant la Conquête. Père d'Aegon, de Visenya et de Rhaenys, il mourut sans jamais avoir régné sur autre chose que son rocher."}],
["valaena",{n:"Valaena Velaryon",s:"f",b:null,d:null,r:0,h:"Velaryon",
  bio:"Épouse d'Aerion, de sang valyrien par sa mère. Mère des trois conquérants."}],

["visenya",{n:"Visenya Targaryen",e:"la Reine guerrière",s:"f",b:-28,d:44,r:1,h:"Targaryen",dr:"Vhagar",
  bio:"Sœur aînée et première épouse d'Aegon. Guerrière, elle portait Sombresœur et fonda la Garde Royale. Mère de Maegor, elle fut soupçonnée de sorcellerie et se retira à Peyredragon."}],
["aegon-i",{n:"Aegon Targaryen",e:"le Conquérant",s:"m",b:-27,d:37,r:1,h:"Targaryen",dr:"Balerion",k:["Ier","1 – 37","1er"],
  bio:"Le Dragon. Avec ses deux sœurs-épouses et trois dragons, il soumit six des sept royaumes en deux ans, fondit le Trône de Fer et bâtit Port-Réal. Mort d'apoplexie à Peyredragon."}],
["rhaenys",{n:"Rhaenys Targaryen",s:"f",b:-25,d:10,r:1,h:"Targaryen",dr:"Meraxes",
  bio:"La plus jeune sœur d'Aegon, sa favorite : rieuse, protectrice des chanteurs. Elle mourut en Dorne quand un carreau de scorpion creva l'œil de Meraxes au-dessus de Lancehélion."}],

["maegor-i",{n:"Maegor Targaryen",e:"le Cruel",s:"m",b:12,d:48,r:2,h:"Targaryen",dr:"Balerion",k:["Ier","42 – 48","3e"],
  bio:"Fils d'Aegon et de Visenya. Il prit la couronne sur son neveu, écrasa la Foi Militante et prit six épouses sans jamais obtenir d'héritier vivant. On le trouva mort sur le Trône de Fer, transpercé par ses propres lames."}],
["aenys-i",{n:"Aenys Targaryen",s:"m",b:7,d:42,r:2,h:"Targaryen",dr:"Vif-Argent",k:["Ier","37 – 42","2e"],
  bio:"Fils d'Aegon et de Rhaenys. Doux, indécis, aimable — et incapable de tenir un royaume : sa faiblesse déchaîna le soulèvement de la Foi. Il mourut à Peyredragon, peut-être empoisonné."}],
["alyssa-vel",{n:"Alyssa Velaryon",s:"f",b:22,d:54,r:2,h:"Velaryon",
  bio:"Reine d'Aenys, elle sauva ses enfants de Maegor puis épousa Rogar Baratheon et fit couronner son fils Jaehaerys. Morte en couches en 54."}],
["rogar",{n:"Rogar Baratheon",s:"m",b:null,d:61,r:2,h:"Baratheon",
  bio:"Sire d'Accalmie, second époux d'Alyssa, Main du Roi et régent du jeune Jaehaerys. Son ambition — écarter Alysanne du trône — brisa sa fortune."}],

["rhaena",{n:"Rhaena Targaryen",s:"f",b:23,d:73,r:3,h:"Targaryen",dr:"Rêvefeu",
  bio:"Fille aînée d'Aenys. Épouse de son frère Aegon, puis, contrainte, de son oncle Maegor. Veuve deux fois, elle vécut à Belle-Île puis à Harrenhal, entourée de ses amies, et refusa toujours de se remarier."}],
["aegon-unc",{n:"Aegon Targaryen",e:"le Non-couronné",s:"m",b:24,d:43,r:3,h:"Targaryen",dr:"Vif-Argent",
  bio:"Fils aîné d'Aenys, héritier légitime. Il défia Maegor au-dessus de l'Œil-des-Dieux : Vif-Argent ne fit pas le poids contre Balerion."}],
["viserys-aenys",{n:"Viserys Targaryen",s:"m",b:29,d:48,r:3,h:"Targaryen",
  bio:"Deuxième fils d'Aenys, gardé en otage par Maegor comme écuyer. Interrogé sans relâche sur la fuite de ses proches, il mourut de mauvais traitements à dix-neuf ans."}],
["jaehaerys-i",{n:"Jaehaerys Targaryen",e:"le Conciliateur",s:"m",b:34,d:103,r:3,h:"Targaryen",dr:"Vermithor",k:["Ier","48 – 103","4e"],
  bio:"Le Vieux Roi. Cinquante-cinq ans de règne : paix avec la Foi, routes, Mur, code de lois, prospérité. Il perdit presque tous ses enfants avant lui et dut faire trancher sa succession par un Grand Conseil."}],
["alysanne",{n:"Alysanne Targaryen",e:"la Bonne Reine",s:"f",b:36,d:100,r:3,h:"Targaryen",dr:"Aile-d'Argent",
  bio:"Sœur-épouse de Jaehaerys, aimée du peuple. Elle abolit le droit de cuissage, dota le Mur du Neuf-Sentinelles, tint ses cours de femmes — et se brouilla gravement avec le roi sur le sort de leurs filles."}],
["vaella",{n:"Vaella Targaryen",s:"f",b:37,d:37,r:3,h:"Targaryen",bio:"Dernière fille d'Aenys, morte au berceau."}],
["jocelyn",{n:"Jocelyn Baratheon",s:"f",b:50,d:null,r:4,h:"Baratheon",
  bio:"Fille d'Alyssa et de Rogar, demi-sœur de Jaehaerys. Grande, brune, elle épousa le prince Aemon et lui donna Rhaenys."}],
["boremund",{n:"Boremund Baratheon",s:"m",b:54,d:129,r:3,h:"Baratheon",f:"n",
  bio:"Né de la mort de sa mère Alyssa. Sire d'Accalmie, il défendit haut et fort le droit de Rhaenys puis de Rhaenyra."}],

["aerea",{n:"Aerea Targaryen",s:"f",b:43,d:56,r:4,h:"Targaryen",dr:"Balerion",
  bio:"Fille de Rhaena, un temps héritière de Maegor. Enfant rebelle, elle vola Balerion et disparut plus d'un an ; elle revint brûlante et mourut atrocement à Port-Réal — l'un des plus sombres mystères du livre."}],
["rhaella",{n:"Rhaella Targaryen",s:"f",b:43,d:null,r:4,h:"Targaryen",
  bio:"Sœur jumelle d'Aerea, confiée à la Foi et devenue septa à Villevieille."}],

["aegon-52",{n:"Aegon Targaryen",s:"m",b:52,d:52,r:4,h:"Targaryen",bio:"Premier-né de Jaehaerys et d'Alysanne, mort au berceau."}],
["daenerys-55",{n:"Daenerys Targaryen",s:"f",b:55,d:60,r:4,h:"Targaryen",
  bio:"Enfant vive et adorée, emportée à quatre ans par le Frisson qui ravagea Port-Réal."}],
["aemon-p",{n:"Aemon Targaryen",s:"m",b:55,d:92,r:4,h:"Targaryen",dr:"Caraxès",
  bio:"Fils aîné survivant, prince de Peyredragon et héritier. Un carreau d'arbalète le tua à Belle-Île, ouvrant la question de succession qui empoisonnera la dynastie."}],
["baelon",{n:"Baelon Targaryen",e:"le Brave",s:"m",b:57,d:101,r:4,h:"Targaryen",dr:"Vhagar",
  bio:"Frère cadet d'Aemon, nommé héritier à sa place au détriment de Rhaenys — précédent lourd de conséquences. Il mourut d'un ventre éclaté que les mestres ne surent ouvrir."}],
["alyssa-t",{n:"Alyssa Targaryen",s:"f",b:60,d:84,r:4,h:"Targaryen",dr:"Meleys",
  bio:"Garçon manqué, moqueuse et casse-cou, elle adorait son frère Baelon qu'elle épousa. Morte à vingt-quatre ans des suites de son troisième accouchement."}],
["maegelle",{n:"Maegelle Targaryen",s:"f",b:62,d:84,r:4,h:"Targaryen",
  bio:"Donnée à la Foi à sept ans, septa et guérisseuse. Elle mourut de la léprose contractée auprès de ceux qu'elle soignait."}],
["vaegon",{n:"Vaegon Targaryen",e:"le Dragon sans dragon",s:"m",b:63,d:null,r:4,h:"Targaryen",
  bio:"Froid, livresque, sans goût pour la cour : envoyé à la Citadelle, il y devint archimestre à l'anneau, la verge et le masque d'or."}],
["daella",{n:"Daella Targaryen",s:"f",b:64,d:82,r:4,h:"Targaryen",
  bio:"Craintive et douce, terrorisée à l'idée du mariage. Elle épousa Rodrik Arryn et mourut en donnant le jour à Aemma."}],
["saera",{n:"Saera Targaryen",s:"f",b:67,d:null,r:4,h:"Targaryen",
  bio:"La fille scandaleuse : ses jeux avec trois jeunes seigneurs firent éclater la cour. Enfuie du septuaire, elle tint une maison de plaisir à Lys puis à Volantis et ne revit jamais son père."}],
["viserra",{n:"Viserra Targaryen",s:"f",b:71,d:84,r:4,h:"Targaryen",
  bio:"La plus belle des filles de Jaehaerys, promise au vieux sire Manderly contre son gré. Elle se rompit le cou en menant une course de chevaux, ivre, dans les rues de Port-Réal."}],
["gaemon-73",{n:"Gaemon Targaryen",s:"m",b:73,d:73,r:4,h:"Targaryen",bio:"Mort au berceau."}],
["valerion-77",{n:"Valerion Targaryen",s:"m",b:77,d:77,r:4,h:"Targaryen",bio:"Mort au berceau."}],
["gael-80",{n:"Gael Targaryen",e:"l'Enfant d'hiver",s:"f",b:80,d:99,r:4,h:"Targaryen",

/* index des relations */
const rel = {};
Object.keys(P).forEach(id => rel[id] = {par:null, sp:[], en:[], fr:[]});
UNIONS.forEach(u => {
  const [a,b,cs] = u;
  if(P[a]&&P[b]){ rel[a].sp.push(b); rel[b].sp.push(a); }
  cs.forEach(c => {
    if(!P[c]) return;
    rel[c].par = [a,b];
    rel[a].en.push(c); rel[b].en.push(c);
  });
});
Object.keys(rel).forEach(id=>{
  const pa = rel[id].par; if(!pa) return;
  const u = UNIONS.find(u=>u[0]===pa[0]&&u[1]===pa[1]);
  rel[id].fr = u[2].filter(x=>x!==id);
  // demi-frères et demi-sœurs : les enfants d'un seul des deux parents
  const demi = new Set();
  UNIONS.forEach(v=>{
    if(v[0]===pa[0]&&v[1]===pa[1]) return;
    if(v[0]===pa[0]||v[1]===pa[0]||v[0]===pa[1]||v[1]===pa[1])
      v[2].forEach(c=>{ if(c!==id) demi.add(c); });
  });
  rel[id].demi = [...demi];
});

/* ====================== calcul des positions ====================== */
const NW=124, NH=54, GX=16, GY=118;
const pos = {}, rowOf = {};
ROWS.forEach((row,ri)=> row.forEach((id,i)=>{ pos[id]=i*(NW+GX); rowOf[id]=ri; }));
const yOf = id => rowOf[id]*GY;
const inTree = id => pos[id]!==undefined;
const moyenne = a => a.reduce((s,v)=>s+v,0)/a.length;

function calcule(){
  for(let it=0; it<220; it++){
    const ordre = it%2 ? ROWS : [...ROWS].slice().reverse();
    ordre.forEach(row=>{
      const cible = row.map(id=>{
        const t=[];
        const pa = rel[id].par;
        if(pa && inTree(pa[0]) && inTree(pa[1])) t.push((pos[pa[0]]+pos[pa[1]])/2);
        const en = rel[id].en.filter(inTree);
        if(en.length) t.push(moyenne(en.map(c=>pos[c])));
        const sp = rel[id].sp.filter(x=>inTree(x)&&rowOf[x]===rowOf[id]);
        if(sp.length) t.push(moyenne(sp.map(x=>pos[x])));
        return t.length ? moyenne(t) : pos[id];
      });
      // on respecte l'ordre de la rangée avec un écart minimal
      const x = []; let cur = -1e9;
      for(let i=0;i<row.length;i++){ x[i] = Math.max(cible[i], cur + NW+GX); cur = x[i]; }
      for(let i=row.length-2;i>=0;i--){ x[i] = Math.min(x[i], x[i+1] - (NW+GX)); }
      const decal = moyenne(cible.map((c,i)=>c-x[i]));
      row.forEach((id,i)=> pos[id] = x[i] + decal*0.6);

      // les époux voisins restent collés l'un à l'autre
      const idx = {}; row.forEach((id,i)=> idx[id]=i);
      UNIONS.forEach(u=>{
        const a=u[0], b=u[1];
        if(idx[a]==null || idx[b]==null || Math.abs(idx[a]-idx[b])!==1) return;
        const g = (pos[a]+pos[b])/2, e = (NW+GX)/2;
        const [gauche,droite] = idx[a]<idx[b] ? [a,b] : [b,a];
        pos[gauche] = g-e; pos[droite] = g+e;
      });
      let cur2 = -1e9;
      row.forEach(id=>{ pos[id] = Math.max(pos[id], cur2 + NW+GX); cur2 = pos[id]; });
    });
  }
  let min=1e9,max=-1e9;
  Object.keys(pos).forEach(id=>{ min=Math.min(min,pos[id]); max=Math.max(max,pos[id]); });
  Object.keys(pos).forEach(id=> pos[id] -= min);
  return {w: max-min + NW + 60, h: (ROWS.length-1)*GY + NH + 60};
}
const DIM = calcule();
const X = id => pos[id] + 30;            // coin gauche
const CX = id => X(id) + NW/2;
const Y = id => yOf(id) + 30;

/* ====================== rendu de l'arbre ====================== */
const svg = document.getElementById('svg');
function dessine(){
  const dim = {w:DIM.w, h:DIM.h};
  let liens = "", noeuds = "";
  const anc = new Set(), desc = new Set();
  if(S.sel){ marque(S.sel, 'par', anc); marque(S.sel, 'en', desc); }
  const surligne = id => S.sel && (id===S.sel || anc.has(id) || desc.has(id));

  UNIONS.forEach((u,ui)=>{
    const [a,b,cs] = u;
    if(!inTree(a) || !inTree(b)) return;
    if(!visible(P[a]) || !visible(P[b])) return;
    const hi = S.sel && (surligne(a)&&surligne(b) || cs.some(c=>surligne(c)&&(surligne(a)||surligne(b))));
    const cls = "lien mar" + (hi?" hi":"");
    let ax, ay;                                   // point d'où part la descendance
    if(rowOf[a]===rowOf[b]){
      const y = Y(a)+NH/2, x1=Math.min(CX(a),CX(b)), x2=Math.max(CX(a),CX(b));
      const g = Math.min(X(a),X(b)) + NW, dte = Math.max(X(a),X(b));
      liens += `<path class="${cls}" d="M${g} ${y} H${dte}"/>`;
      liens += `<circle cx="${(g+dte)/2}" cy="${y}" r="3" fill="var(--enc2)"/>`;
      ax = (x1+x2)/2; ay = Y(a)+NH;
    } else {
      const haut = rowOf[a]<rowOf[b] ? a : b, bas = haut===a?b:a;
      const cote = CX(haut) < CX(bas) ? -1 : 1;
      const xb = X(bas) + (cote<0 ? 0 : NW), yb = Y(bas)+NH/2;
      liens += `<path class="${cls}" d="M${CX(haut)} ${Y(haut)+NH} V${yb} H${xb}"/>`;
      liens += `<circle cx="${(CX(haut)+xb)/2}" cy="${yb}" r="3" fill="var(--enc2)"/>`;
      ax = (CX(haut)+xb)/2; ay = yb;
    }
    const enf = cs.filter(c=>inTree(c) && visible(P[c]));
    if(!enf.length) return;
    const yEnf = Math.min(...enf.map(Y));
    const barre = yEnf - 22 - (ui%3)*7;
    const xs = enf.map(CX);
    liens += `<path class="lien${hi?' hi':''}" d="M${ax} ${ay} V${barre}"/>`;
    liens += `<path class="lien${hi?' hi':''}" d="M${Math.min(...xs,ax)} ${barre} H${Math.max(...xs,ax)}"/>`;
    enf.forEach(c=> liens += `<path class="lien${S.sel&&surligne(c)?' hi':''}" d="M${CX(c)} ${barre} V${Y(c)}"/>`);
  });

  ROWS.flat().forEach(id=>{
    const p = P[id]; if(!visible(p)) return;
    const x=X(id), y=Y(id);
    let c = "nd";
    if(p.k) c+=" roi";
    if(p.f) c+=" f"+p.f;
    if(id===S.sel) c+=" sel";
    if(S.sel && !surligne(id)) c+=" dim";
    if(S.mode==='rois' && !p.k) c+=" dim";
    if(S.mode==='dragons' && !p.dr) c+=" dim";
    const nom = nomCourt(p);
    const maison = p.h && p.h!=="Targaryen" ? p.h : "";
    noeuds += `<g class="${c}" data-id="${id}">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}"/>
      ${p.k?`<text class="cr" x="${x+NW-9}" y="${y+14}" text-anchor="end" fill="var(--or)">♛</text>`:""}
      <text class="nm" x="${x+NW/2}" y="${y+21}" text-anchor="middle">${nom}</text>
      <text class="an" x="${x+NW/2}" y="${y+34}" text-anchor="middle">${dates(p)}</text>
      ${maison?`<text class="hs" x="${x+NW/2}" y="${y+46}" text-anchor="middle">${maison}</text>`
        : p.dr?`<text class="dg" x="${x+NW/2}" y="${y+46}" text-anchor="middle">🜂 ${p.dr}</text>`:""}
    </g>`;
  });

  svg.setAttribute('width', dim.w); svg.setAttribute('height', dim.h);
  svg.setAttribute('viewBox', `0 0 ${dim.w} ${dim.h}`);
  svg.innerHTML = liens + noeuds;
}
function marque(id, sens, ens){
  const suite = sens==='par' ? (rel[id].par||[]) : rel[id].en;
  suite.forEach(x=>{ if(!ens.has(x)){ ens.add(x); marque(x, sens, ens); } });
}

/* ====================== zoom / déplacement ====================== */
const zone = document.getElementById('zone'), pan = document.getElementById('pan');
let vue = {x:0, y:0, k:1};
const applique = ()=> pan.style.transform = `translate(${vue.x}px,${vue.y}px) scale(${vue.k})`;
function ajuste(anim, brut){
  const r = zone.getBoundingClientRect();
  const kf = Math.min(r.width/DIM.w, r.height/DIM.h) * 0.96;
  const k = brut ? kf : Math.max(kf, 0.45);          // au démarrage, jamais illisible
  if(k > kf + 0.001){                                 // l'arbre déborde : on se pose en haut, sur Aegon
    vue = {k, x: r.width/2 - CX('aegon-i')*k, y: 40};
  } else {
    vue = {k, x:(r.width-DIM.w*k)/2, y:(r.height-DIM.h*k)/2 + 8};
  }
  if(anim){ pan.style.transition='transform .25s'; setTimeout(()=>pan.style.transition='',260); }
  applique();
}
function centre(id){
  if(!inTree(id)) return;
  const r = zone.getBoundingClientRect();
  vue.k = Math.max(vue.k, 0.85);
  vue.x = r.width/2 - CX(id)*vue.k;
  vue.y = r.height/2 - (Y(id)+NH/2)*vue.k;
  pan.style.transition='transform .3s'; applique(); setTimeout(()=>pan.style.transition='',320);
}
function zoom(f, cx, cy){
  const r = zone.getBoundingClientRect();
  cx = cx==null ? r.width/2 : cx; cy = cy==null ? r.height/2 : cy;
  const k2 = Math.min(3, Math.max(0.12, vue.k*f));
  vue.x = cx - (cx-vue.x)*(k2/vue.k); vue.y = cy - (cy-vue.y)*(k2/vue.k); vue.k = k2;
  applique();
}
let ptrs = new Map(), dep = null, bouge = 0;
zone.addEventListener('pointerdown', e=>{
  zone.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  bouge = 0;
  if(ptrs.size===1) dep = {x:e.clientX-vue.x, y:e.clientY-vue.y};
  if(ptrs.size===2) dep = null;
});
zone.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  const av = ptrs.get(e.pointerId);
  bouge += Math.abs(e.clientX-av.x)+Math.abs(e.clientY-av.y);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1 && dep){ vue.x = e.clientX-dep.x; vue.y = e.clientY-dep.y; applique(); }
  else if(ptrs.size===2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(zone._d){
      const r = zone.getBoundingClientRect();
      zoom(d/zone._d, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    }
    zone._d = d;
  }
});
['pointerup','pointercancel'].forEach(ev=> zone.addEventListener(ev, e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) zone._d = null;
  if(ptrs.size===0 && bouge < 8){
    const g = e.target.closest('.nd');
    if(g) ouvre(g.dataset.id);
  }
}));
zone.addEventListener('wheel', e=>{ e.preventDefault();
  const r = zone.getBoundingClientRect();
  zoom(e.deltaY<0?1.12:0.89, e.clientX-r.left, e.clientY-r.top);
},{passive:false});
document.getElementById('z-plus').onclick = ()=>zoom(1.25);
document.getElementById('z-moins').onclick = ()=>zoom(0.8);
document.getElementById('z-fit').onclick = ()=>{ S.sel=null; dessine(); ajuste(true, true); };

  };

    ${p.e?`<div class="epi">« ${p.e} »</div>`:""}
    <div style="font-size:.9rem;color:var(--enc2)">${p.b!=null?"Né"+(p.s==='f'?"e":"")+" en "+an(p.b):"Dates inconnues"}${
      p.d!=null && !cache ? " · mort"+(p.s==='f'?"e":"")+" en "+an(p.d)+(p.b!=null&&p.b>=0?` (${p.d-p.b} ans)`:"") : ""}</div>
    <div class="meta">${tags.join('')}</div>
    ${cache
      ? `<div class="masque">La suite de son histoire vient après ton avancée dans le livre.<br><button id="reveler">Révéler quand même</button></div>`
      : `<div class="bio">${p.bio||""}</div>`}
    <div class="rel">
      ${bloc("Parents", rel[id].par||[])}
      ${bloc(rel[id].sp.length>1?"Époux et épouses":"Époux·se", rel[id].sp)}
      ${bloc("Enfants", rel[id].en)}
      ${bloc("Frères et sœurs", rel[id].fr)}
      ${bloc("Demi-frères et demi-sœurs", rel[id].demi||[])}
    </div>
    <div class="act">
      ${inTree(id)?`<button id="voir-arbre">Voir dans l'arbre</button>`:""}
      <button class="sec" id="fermer2">Fermer</button>
    </div>`;
  feuille.scrollTop = 0;
  fiche.classList.add('on');
  feuille.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>ouvre(b.dataset.go));
  feuille.querySelector('#x-fiche').onclick = ferme;
  feuille.querySelector('#fermer2').onclick = ferme;

  if(r) r.onclick = ()=>{ r.closest('.masque').outerHTML = `<div class="bio">${p.bio||""}</div>`; };
  const va = feuille.querySelector('#voir-arbre');
  if(va) va.onclick = ()=>{ ferme(); onglet('arbre'); centre(id); };
}

/* ---- mise à jour automatique ----
   Deux filets : le service worker (network-first, se recharge quand une nouvelle version
   prend la main) et une comparaison directe de VERSION_APP avec le fichier en ligne,
   qui attrape aussi les mises à jour où seul index.html a changé. */
async function versionEnLigne(){
  try{
    const r = await fetch('index.html?v=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/VERSION_APP\s*=\s*"([^"]+)"/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
async function majAuto(){
  if(sessionStorage.getItem('tg-maj')) return;      // une seule relance par session, jamais de boucle
  const v = await versionEnLigne();
  if(v && v !== VERSION_APP){ sessionStorage.setItem('tg-maj','1'); location.reload(); }
}
setTimeout(majAuto, 2500);
addEventListener('visibilitychange', ()=>{ if(!document.hidden) majAuto(); });

if('serviceWorker' in navigator){
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(recharge) return; recharge = true; location.reload();
  });
  addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});
      // on revérifie à chaque retour dans l'app, et une fois par heure
      addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
      setInterval(()=> reg.update().catch(()=>{}), 3600e3);
    }).catch(()=>{});
  });
}
</script>
